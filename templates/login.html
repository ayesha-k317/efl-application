{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <form id="login-form">
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <h2>New customer? Create an account</h2>
  <form id="register-form">
    <label for="reg-name">Name</label>
    <input id="reg-name" type="text" autocomplete="name" required>
    <label for="reg-email">Email</label>
    <input id="reg-email" type="email" autocomplete="email" required>
    <label for="reg-phone">Phone (optional)</label>
    <input id="reg-phone" type="tel" autocomplete="tel">
    <label for="reg-password">Password (8 or more characters, with a letter and a number)</label>
    <input id="reg-password" type="password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p id="error" class="error" role="alert"></p>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
